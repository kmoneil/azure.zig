name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes its older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job name here is meant to be a required status check on main;
# renaming one means updating the branch protection in the same change.
#
# setup-zig is given no version: it installs build.zig.zon's
# minimum_zig_version, so the pin lives in one place. zigvet and gnarl are
# released binaries, not packages, each pinned by digest in
# .github/actions/vet-tools; gnarl's release is complexity.zon's `.gnarl`.
# rest-core is fetched by the hash build.zig.zon pins.
#
# To come, with what it runs: nightly fuzzing with the first module that
# has fuzz properties.
jobs:
  # All of `zig build test`, on every platform: the unit and property
  # tests, zig fmt --check, zigvet and gnarl.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - uses: ./.github/actions/vet-tools
      - name: zig build test
        run: zig build test --summary all

  # Every relative link and anchor in the Markdown resolves, every page is
  # linked from another, and each block the guides mark as a snippet is the
  # code in examples/ or tests/docs_examples.zig, which `test` compiles.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tools/check_docs.py
        run: python3 -I tools/check_docs.py

  # A program builds this package in the mode it ships, and in ReleaseFast
  # `unreachable`, overflow and a bad cast are undefined rather than a
  # panic.
  release-modes:
    name: test-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: ReleaseSafe
        run: zig build test-unit -Doptimize=ReleaseSafe --summary all
      - name: ReleaseFast
        run: zig build test-unit -Doptimize=ReleaseFast --summary all

  # Line coverage of the unit tests. Debian packages kcov and the Ubuntu
  # 24.04 runners do not, so this job runs in a Debian container (gcp.zig's
  # job, at eae944c).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # debian:trixie-slim; `docker buildx imagetools inspect` gives a newer digest.
      image: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
      # kcov turns off address-space randomization for the process it traces,
      # which Docker's default seccomp profile forbids.
      options: --security-opt seccomp=unconfined
    steps:
      - name: Install kcov
        run: |
          apt-get update
          apt-get install -y --no-install-recommends kcov ca-certificates git xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Measure coverage
        run: zig build coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: zig-out/coverage

  # Storage's suite against Azurite, Blob Storage's emulator, which checks
  # every Shared Key signature: `zig build test-integration`.
  azurite:
    name: azurite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      azurite:
        # mcr.microsoft.com/azure-storage/azurite:3.37.0; `docker buildx
        # imagetools inspect` gives a newer digest.
        image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        ports:
          - 10000:10000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Wait for Azurite
        run: curl --retry 30 --retry-connrefused --retry-delay 1 -s -o /dev/null 'http://127.0.0.1:10000/devstoreaccount1?comp=list'
      - name: zig build test-integration
        env:
          AZURITE_TEST: "1"
        run: zig build test-integration --summary all
